<template>
    <c-p2-main-layout
        user-id = {userId}
        user-first-name = {userFirstName}
        user-last-name = {userLastName}
        user-name = {userName}
        user-photo-url = {userPhotoUrl}
        lang-code = {langCode}

        onlanguagechanged={handleLanguageChange}
    >

            slot="leftNav"

            tasks-selected = "true"
            application-notified = "true"

        <div slot="bodyContent">
            <h1>Main contents</h1>
        </div>
    </c-p2-main-layout>
