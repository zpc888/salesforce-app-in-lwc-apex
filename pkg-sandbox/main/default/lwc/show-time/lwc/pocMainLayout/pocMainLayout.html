<template>
    <c-p2-layout-main
        user-id = {userId}
        user-first-name = {userFirstName}
        user-last-name = {userLastName}
        user-name = {userName}
        user-photo-url = {userPhotoUrl}
        lang-code = {langCode}

        onlanguagechanged={handleLanguageChange}
    >
        <c-p2-layout-main-menu
            slot="mainMenu"
            lang-code = {langCode}
            tasks-selected = "true"
            application-notified = "true"
        ></c-p2-layout-main-menu>
        <c-p2-layout-sub-menu
            lang-code = {langCode}
            slot="subMenu"
        >
            <div slot="subMenuTopLeft">
                <h1>Sub Menu Top Left</h1>
            </div>
            <div>
                <h1>Sub Menu Content</h1>
                <p>Some content for the sub menu goes here.</p>
            </div>
        </c-p2-layout-sub-menu>
        <div>
            <h1>Main contents</h1>
        </div>
        <div slot="activityReminder">
            <h1>Activity Reminder</h1>
        </div>
    </c-p2-layout-main>
</template>
