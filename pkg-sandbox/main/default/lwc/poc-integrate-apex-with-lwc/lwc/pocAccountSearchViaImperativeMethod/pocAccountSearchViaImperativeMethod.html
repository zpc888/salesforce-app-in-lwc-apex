<template>
    <lightning-card title="Account Search - Wire Function with Apex">
        <div class="slds-var-p-around_medium">
            <lightning-input type="search" label="Account Name" onchange={handleAccountNameChange} >
            </lightning-input>

            <lightning-button label="Search" onclick={handleSearch} variant="brand"></lightning-button>

            <template if:true={accounts}>
                <lightning-datatable data={accounts} 
                    key-field="Id" 
                    columns={columns} 
                    hide-checkbox-column="true" 
                ></lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
