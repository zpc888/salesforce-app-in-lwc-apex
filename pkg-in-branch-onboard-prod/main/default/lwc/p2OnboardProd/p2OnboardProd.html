<template>
    <c-p2-layout-main
        user-id = {userId}
        user-first-name = {userFirstName}
        user-last-name = {userLastName}
        user-name = {userName}
        user-photo-url = {userPhotoUrl}

        lang-code = {langCode}
        onlanguagechanged={handleLanguageChange}

        other-apps = {otherApps}
        onappswitch={handleAppSwitchEvent}
    >
        <c-p2-layout-main-menu
            slot="mainMenu"
            lang-code = {langCode}
            menu-items={mainMenuItems}
        ></c-p2-layout-main-menu>
        <c-p2-layout-sub-menu
            lang-code = {langCode}
            slot="subMenu"
        >
            <c-p2-layout-app-info
                app-info = {appInfo}
                slot="subMenuTopLeft"
            ></c-p2-layout-app-info>
            <c-p2-layout-tree-menu
                selected-key={treeMenuSelectedItem}
                menu-items = {treeMenuItems}
                onmenuselect={handleMenuSelect}
                ></c-p2-layout-tree-menu>
        </c-p2-layout-sub-menu>

        <c-p2-layout-content
            lang-code = {langCode}
        >
            Onboarding Product Apply Page / (Fr)
        </c-p2-layout-content>

        <c-p2-layout-utils
            lang-code={langCode}
            slot="utils"
        >
            <div slot="utilsExpanded" class="poc-utils">
                <c-p2-layout-timeline
                    lang-code={langCode}
                    title={timelineTitle}
                    items={timelineItems}
                ></c-p2-layout-timeline>                
            </div>
            <div slot="utilsCollapsed" class="poc-utils">
            </div>
        </c-p2-layout-utils>
    </c-p2-layout-main>
</template>
