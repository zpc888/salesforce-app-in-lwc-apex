<template>
    <div class="p-box">
        <div class="p-box-header">
            <div>
                <img src={boxHeaderIcon} alt="" />
            </div>
            <div>
                <h2 class="p-font-h2-title">{boxTitle}</h2>
            </div>
            <div>
                <slot name="boxHeaderActions"></slot>
            </div>
            <div lwc:if={isToggleable}>
                <button
                    aria-controls="pBoxyBody pBoxFooter"
                    aria-expanded={isExpanded}
                    aria-label={toggleAriaLabel}
                    onclick={handleToggle}
                >
                    <img src={toggleIcon} alt="" />
                </button>                
            </div>
        </div>
        <div class="p-box-body" id="pBoxBody" lwc:if={isExpanded}>
            <slot></slot>
        </div>
        <div class="p-box-footer" id="pBoxFooter" lwc:if={isExpanded}>
            <slot name="boxFooter"></slot>
        </div>
    </div>
</template>
