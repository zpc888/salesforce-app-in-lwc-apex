<template>
   <div class="p-main-layout">
    <section class="p-masthead" role="banner">
        <section class="p-masthead-brand">
            <div class="p-c-both-center" lwc:if={isMastheadExpanded}>
                <img width="50px" height="50px" 
                    src={logoUrl} alt={i18n.logoAlt} />
            </div>
            <h1 class="p-masthead-brand-title-text" lwc:if={isMastheadExpanded}>
                {i18n.projectName}
            </h1>
        </section>
        <section class="p-c-both-center">
            <ul>
                <li>
                    <div class="p-masthead-action">
                        <button
                            class="p-c-both-center p-font-masthead-title"
                            onclick={handleLanguageSwitch}
                        >
                            {i18n.switchLanguageButton}
                    </button>
                    </div>
                </li>
                <li>
                    <div class="p-masthead-action">
                        <span class="p-vertical-divider"></span>
                    </div>
                </li>
                <li>
                    <div class="p-masthead-action">
                        <div class="p-photo-container p-masthead-user-photo">
                            <template lwc:if={hasUserPhoto}>
                                <img src={userPhotoUrl} alt="" class="branding-user-profile circular" />
                            </template>
                            <template lwc:else>
                                <span class="p-c-both-center p-font-masthead-title">
                                    {firstLastInitial}
                                </span>
                            </template>
                        </div>
                        <div class="p-c-both-center p-font-masthead-title" lwc:if={isMastheadExpanded}>
                            {userName}
                        </div>
                    </div>
                </li>
                <li>
                    <div class="p-masthead-action">
                        <span class="p-vertical-divider"></span>
                    </div>
                </li>
                <li>
                    <template lwc:if={canAccessMoreApps}>
        <div class="p-dropdown" lwc:ref="refAppSwitchDropdown">
            <!-- <button class="p-dropdown-link p-font-masthead-title"
                onclick={toggleAppSwitch}> -->
            <button class="p-dropdown-link p-font-masthead-title">
                {i18n.switchAppButton}
            </button>
            <div class="p-dropdown-menu">
                <div class="p-dropdown-item">
                    <template for:each={otherApps} for:item="appMenu">
                        <button 
                            key={appMenu.name} 
                            onclick={handleAppSwitch} 
                            data-url={appMenu.url} 
                            data-app-name={appMenu.name} 
                            class="p-dropdown-link p-font-masthead-title">
                            {appMenu.label}
                        </button>
                    </template>
                    <span></span>
                    <button 
                        onclick={handleAppExit} 
                        class="p-dropdown-link p-font-masthead-title">
                        {i18n.exitAppButton}
                    </button>
                </div>
            </div>
        </div>
        </template>
                    <template lwc:else>
                        <button
                            class="p-masthead-action"
                            onclick={handleAppExit}
                        >
                            <span class="p-c-both-center">
                                <img src={exitAppIconUrl} alt="" />
                            </span>
                            <span class="p-c-both-center p-font-masthead-title">
                                {i18n.exitAppButton}
                            </span>
                        </button>
                    </template>
                </li>
            </ul>
        </section>
    </section>
    <section class="p-body-layout" role="main">
        <div class="p-body-main-menu">
            <slot name="mainMenu"></slot>
        </div>
        <div class="p-body-sub-menu">
            <slot name="subMenu"></slot>
        </div>
        <div class="p-body-main">
            <slot></slot>
        </div>
        <div class="p-body-utils">
            <slot name="utils"></slot>
        </div>
    </section>
   </div> 
</template>
