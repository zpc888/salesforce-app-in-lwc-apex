<template>
   <div class="p-main-layout">
    <section class="p-masthead" role="banner">
        <section class="p-masthead-brand">
            <div class="p-c-both-center">
                <img width="50px" height="50px" 
                    src={logoUrl} alt={i18n.logoAlt} />
            </div>
            <h1 class="p-masthead-brand-title-text">{i18n.projectName}</h1>
        </section>
        <section class="p-c-both-center">
            <ul>
                <li>
                    <div class="p-masthead-action">
                        <button
                            class="p-c-both-center p-font-masthead-title"
                            onclick={handleLanguageSwitch}
                        >
                            {i18n.switchLanguageButton}
                    </button>
                    </div>
                </li>
                <li>
                    <div class="p-masthead-action">
                        <span class="p-vertical-divider"></span>
                    </div>
                </li>
                <li>
                    <div class="p-masthead-action">
                        <div class="p-photo-container p-masthead-user-photo">
                            <template lwc:if={hasUserPhoto}>
                                <img src={userPhotoUrl} alt="" class="branding-user-profile circular" />
                            </template>
                            <template lwc:else>
                                <span class="p-c-both-center p-font-masthead-title">
                                    {firstLastInitial}
                                </span>
                            </template>
                        </div>
                        <div class="p-c-both-center p-font-masthead-title" lwc:if={isMastheadExpanded}>
                            {userName}
                        </div>
                    </div>
                </li>
                <li>
                    <div class="p-masthead-action">
                        <span class="p-vertical-divider"></span>
                    </div>
                </li>
                <li>
                    <button
                        class="p-masthead-action"
                        onclick={handleAppSwitch}
                    >
                        <span class="p-c-both-center">
                            <img src={switchAppIconUrl} alt="" />
                        </span>
                        <span class="p-c-both-center p-font-masthead-title">
                            {i18n.switchAppButton}
                        </span>
                    </button>
                </li>
            </ul>
        </section>
    </section>
    <section class="p-body-layout" role="main">
        <div class="p-body-left-nav">
            <slot name="leftNav"></slot>
        </div>
        <div class="p-body-left-menu">
            <div class="p-body-left-menu-app-info">
                <slot name="leftMenuAppInfo"></slot>
            </div>
            <div class="p-body-left-menu-tree">
                <slot name="leftMenuTree"></slot>
            </div>
        </div>
        <div class="p-body-main">
            <div class="p-body-main-header">
                <slot name="mainHeader"></slot>
            </div>
            <div class="p-body-main-content">
                <slot name="mainContent"></slot>
            </div>
            <div class="p-body-main-footer">
                <slot name="mainFooter"></slot>
            </div>
        </div>
        <div class="p-body-right-panel">
            <slot name="rightPanel"></slot>
        </div>
    </section>
   </div> 
</template>
