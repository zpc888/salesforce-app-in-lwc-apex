<template>
    <div class="p-timeline-item-wrapper">
        <div class="p-timeline-item-header">
            <button 
                aria-expanded={expanded}
                aria-controls="pTimelineItemContent"
                aria-label={timelineItemAriaLabel}
                onclick={handleToggleClick}
                >
                <img src={image} alt="" />
            </button>
            <div class="p-timeline-item-heading">{heading}</div>
            <div class="p-timeline-item-status">{status}</div>
        </div>
        <div class="p-timeline-item-content" id="pTimelineItemContent"
            lwc:if={expanded}>
            <div class="p-timeline-item" lwc:if={hasDateTime}>
                <div class="p-timeline-item-divider"></div>
                <div>{dateTime}</div>
            </div>
            <div class="p-timeline-item" lwc:if={hasOperator}>
                <div class="p-timeline-item-divider"></div>
                <div>{operator}</div>
            </div>
            <div class="p-timeline-item" lwc:if={hasComments}>
                <div class="p-timeline-item-divider"></div>
                <div>{comments}</div>
            </div>
        </div>
    </div>
</template>
